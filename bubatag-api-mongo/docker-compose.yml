
services:
  api:
    build: .
    container_name: bubatag-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: ${MONGO_URI}
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongo
      - ml-service

  mongo:
    image: mongo:8
    container_name: bubatag-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  ml-service:
    build:
      context: ../bubatag-ml-service
    container_name: bubatag-ml-service
    ports:
      - "8000:8000"
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  mongo_data:
