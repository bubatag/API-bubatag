services:
  api:
    build: .
    container_name: bubatag-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/bubatag
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: bubatag-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: